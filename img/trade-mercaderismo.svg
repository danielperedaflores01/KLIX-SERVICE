<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t">
  <title id="t">Mercaderista ordenando productos en el anaquel de una tienda</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/><stop offset="1" stop-color="#ffe3a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="440" rx="24" fill="url(#bg)"/>
  <rect y="372" width="600" height="68" fill="#f0c463"/>
  <rect y="372" width="600" height="6" fill="#e2ad3c"/>

  <!-- Anaquel -->
  <g>
    <rect x="40" y="56" width="330" height="320" rx="8" fill="#2e3550"/>
    <rect x="52" y="68" width="306" height="300" fill="#3b4364"/>
    <!-- repisas -->
    <rect x="46" y="150" width="318" height="10" fill="#22283b"/>
    <rect x="46" y="240" width="318" height="10" fill="#22283b"/>
    <rect x="46" y="330" width="318" height="10" fill="#22283b"/>
    <!-- etiquetas de precio -->
    <g fill="#f5b400">
      <rect x="70" y="160" width="34" height="12" rx="2"/><rect x="190" y="160" width="34" height="12" rx="2"/><rect x="300" y="160" width="34" height="12" rx="2"/>
      <rect x="70" y="250" width="34" height="12" rx="2"/><rect x="190" y="250" width="34" height="12" rx="2"/><rect x="300" y="250" width="34" height="12" rx="2"/>
    </g>
    <!-- fila 1: cajas -->
    <g>
      <rect x="62" y="96" width="34" height="54" rx="3" fill="#1fb5e0"/><rect x="98" y="96" width="34" height="54" rx="3" fill="#1fb5e0"/><rect x="134" y="96" width="34" height="54" rx="3" fill="#1fb5e0"/>
      <rect x="66" y="108" width="26" height="10" fill="#fff" opacity=".8"/><rect x="102" y="108" width="26" height="10" fill="#fff" opacity=".8"/><rect x="138" y="108" width="26" height="10" fill="#fff" opacity=".8"/>
      <rect x="176" y="104" width="30" height="46" rx="3" fill="#ef5b4c"/><rect x="208" y="104" width="30" height="46" rx="3" fill="#ef5b4c"/><rect x="240" y="104" width="30" height="46" rx="3" fill="#ef5b4c"/>
      <circle cx="191" cy="122" r="8" fill="#fff" opacity=".85"/><circle cx="223" cy="122" r="8" fill="#fff" opacity=".85"/><circle cx="255" cy="122" r="8" fill="#fff" opacity=".85"/>
      <rect x="280" y="90" width="34" height="60" rx="3" fill="#6fd3a0"/><rect x="316" y="90" width="34" height="60" rx="3" fill="#6fd3a0"/>
      <rect x="284" y="104" width="26" height="14" fill="#fff" opacity=".8"/><rect x="320" y="104" width="26" height="14" fill="#fff" opacity=".8"/>
    </g>
    <!-- fila 2: botellas -->
    <g fill="#f5b400">
      <path d="M70 240v-46c0-6 6-8 6-16v-10h10v10c0 8 6 10 6 16v46z"/>
      <path d="M100 240v-46c0-6 6-8 6-16v-10h10v10c0 8 6 10 6 16v46z"/>
      <path d="M130 240v-46c0-6 6-8 6-16v-10h10v10c0 8 6 10 6 16v46z"/>
    </g>
    <g fill="#fff" opacity=".85"><rect x="72" y="206" width="18" height="14"/><rect x="102" y="206" width="18" height="14"/><rect x="132" y="206" width="18" height="14"/></g>
    <g fill="#9b6cf0">
      <rect x="178" y="192" width="40" height="48" rx="6"/><rect x="222" y="192" width="40" height="48" rx="6"/>
    </g>
    <g fill="#fff" opacity=".8"><rect x="186" y="206" width="24" height="8" rx="2"/><rect x="230" y="206" width="24" height="8" rx="2"/></g>
    <!-- hueco (quiebre) que se está reponiendo -->
    <rect x="276" y="186" width="76" height="54" rx="4" fill="none" stroke="#f5b400" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- fila 3: bolsas -->
    <g fill="#1fb5e0">
      <path d="M64 330l4-56h36l4 56z"/><path d="M112 330l4-56h36l4 56z"/>
    </g>
    <g fill="#ef5b4c">
      <path d="M170 330l4-50h34l4 50z"/><path d="M216 330l4-50h34l4 50z"/><path d="M262 330l4-50h34l4 50z"/><path d="M308 330l4-50h34l4 50z"/>
    </g>
    <g fill="#fff" opacity=".8"><circle cx="86" cy="300" r="8"/><circle cx="134" cy="300" r="8"/><circle cx="191" cy="302" r="7"/><circle cx="237" cy="302" r="7"/><circle cx="283" cy="302" r="7"/><circle cx="329" cy="302" r="7"/></g>
    <!-- cabecera de marca -->
    <rect x="40" y="26" width="330" height="40" rx="8" fill="#f08a00"/>
    <text x="205" y="53" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="18" fill="#fff">¡OFERTA!</text>
  </g>

  <!-- Mercaderista -->
  <g>
    <!-- piernas -->
    <rect x="414" y="296" width="24" height="82" rx="8" fill="#22283b"/>
    <rect x="444" y="296" width="24" height="82" rx="8" fill="#22283b"/>
    <ellipse cx="424" cy="380" rx="18" ry="7" fill="#161a28"/>
    <ellipse cx="460" cy="380" rx="18" ry="7" fill="#161a28"/>
    <!-- polo -->
    <path d="M400 196c0-18 16-30 41-30s41 12 41 30v108h-82z" fill="#1fb5e0"/>
    <path d="M425 170l16 20 16-20" fill="#fff"/>
    <rect x="450" y="214" width="20" height="14" rx="3" fill="#fff"/>
    <text x="460" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#161a28">K</text>
    <!-- brazo que coloca producto -->
    <path d="M404 200c-20 6-44 6-58 4" stroke="#1fb5e0" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="340" cy="204" r="11" fill="#c98b5e"/>
    <rect x="318" y="190" width="30" height="46" rx="3" fill="#6fd3a0"/>
    <rect x="322" y="204" width="22" height="12" fill="#fff" opacity=".8"/>
    <!-- brazo con celular -->
    <path d="M478 204c14 24 16 46 6 62" stroke="#1fb5e0" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="482" cy="270" r="11" fill="#c98b5e"/>
    <rect x="472" y="246" width="26" height="42" rx="5" fill="#161a28"/>
    <rect x="475" y="251" width="20" height="30" rx="2" fill="#1fb5e0"/>
    <!-- cabeza -->
    <rect x="432" y="150" width="18" height="20" fill="#c98b5e"/>
    <circle cx="441" cy="130" r="28" fill="#c98b5e"/>
    <path d="M412 124c0-22 14-34 30-34s30 12 30 32c-8-6-18-10-30-10s-22 4-30 12z" fill="#161a28"/>
    <path d="M410 120h66c4 0 6 6 0 8h-66z" fill="#22283b"/>
    <path d="M466 120c10 0 20 2 24 6-6 2-16 2-24 2z" fill="#22283b"/>
    <circle cx="451" cy="134" r="3" fill="#161a28"/>
    <path d="M444 148c6 4 12 3 16-1" stroke="#7a4a2a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Tarjeta de reporte -->
  <g>
    <rect x="452" y="30" width="126" height="92" rx="14" fill="#fff"/>
    <path d="M498 122l10 14 8-14z" fill="#fff"/>
    <text x="466" y="54" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="12" fill="#161a28">Visita registrada</text>
    <g font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" fill="#5d6478">
      <circle cx="472" cy="72" r="7" fill="#6fd3a0"/><path d="M468 72l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="486" y="76">Foto + GPS</text>
      <circle cx="472" cy="92" r="7" fill="#6fd3a0"/><path d="M468 92l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="486" y="96">Precios</text>
      <circle cx="472" cy="112" r="7" fill="#f5b400"/><text x="469" y="116" fill="#fff" font-weight="800" font-size="11">!</text>
      <text x="486" y="116">Quiebre</text>
    </g>
  </g>
</svg>
